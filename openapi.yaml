# API 계약의 단일 원본 (ADR-009).
# 여기부터 고치고 `make generate`를 돌린다. Go 핸들러나 TS 클라이언트를 먼저 고치면 덮어써진다.
openapi: 3.0.3
info:
  title: reclassic API
  version: 0.1.0
  description: |
    Project Gutenberg 도서를 장·문단으로 분해하고 문단별 번역을 검수·공개하는 서비스의 API.
    지금은 골격 슬라이스라 헬스체크 하나뿐이다.

servers:
  - url: http://localhost:8080
    description: 로컬 개발

paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: 서비스와 DB 연결 상태
      description: db 필드는 실제 커넥션 Ping 결과다. 상수가 아니다.
      responses:
        "200":
          description: 서비스가 응답한다. db가 down이어도 200이다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /books:
    get:
      operationId: listBooks
      summary: 공개 도서 목록 — published 프로젝트만
      description: |
        `published`의 의미는 하나다: 이 목록에 노출되는가 (ADR-036).
        한 책에 대상 언어가 여럿이면 행이 여러 개다 — 화면이 프로젝트로 링크를 걸려면
        프로젝트 식별자가 행마다 필요하기 때문이다.
        응답은 `{ items }`로 감싼다. 페이지네이션은 아직 없다 (ADR-037).
      responses:
        "200":
          description: 공개된 번역 프로젝트와 그 원서
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookList"

  # 잠정 계약이다. 최종은 번역 프로젝트 기반의 GET /projects/{id}/chapters/{idx}이고
  # (ARCHITECTURE "API 계약"), 그건 translation_projects가 생겨야 성립한다.
  # 번역 슬라이스에서 교체하며, 그때 이 엔드포인트를 남길지 없앨지 함께 정한다.
  #
  # 번역 관련 필드는 넣지 않는다. approvedTranslation을 항상 null로 채우면
  # 계약이 거짓말을 하게 된다. 없는 것은 스키마에 없어야 한다.
  /books/{gutenbergId}/chapters/{idx}:
    get:
      operationId: getBookChapter
      summary: 활성 revision의 챕터 하나와 그 문단들
      description: |
        활성 revision이 없으면(수집 실패, 게이트에 걸려 needs_review인 경우) 404다.
        읽기 화면은 챕터 단위로 자른다 — 책 하나에 문단이 5,000개를 넘길 수 있다.
      parameters:
        - name: gutenbergId
          in: path
          required: true
          description: Project Gutenberg 도서 번호
          schema:
            type: integer
            minimum: 1
        - name: idx
          in: path
          required: true
          description: 0부터 시작하는 챕터 순번
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: 챕터와 문단
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterView"
        "404":
          description: 활성 revision이 없거나 해당 챕터가 없다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: 현재 로그인한 사용자
      security:
        - session: []
      responses:
        "200":
          description: 로그인 상태
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: 로그인이 필요하다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/logout:
    post:
      operationId: logout
      summary: 로그아웃 — 세션을 즉시 무효화한다
      security:
        - session: []
      responses:
        "204":
          description: 로그아웃됨

  /admin/books:
    post:
      operationId: requestBook
      summary: 도서 수집 지시
      description: |
        books 행 생성과 FetchSource 잡 등록을 **한 트랜잭션 안에서** 한다.
        "책은 생성됐는데 잡 등록이 실패"하는 틈이 없다 — ADR-003이 River를 고른 근거다.

        수집은 비동기라 202다. 결과는 books.status로 확인한다.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookRequest"
      responses:
        "202":
          description: 수집을 지시했다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookRequestAccepted"
        "401":
          description: 로그인이 필요하다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: 관리자 권한이 없다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 이미 수집이 지시된 책이다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/books/needs-review:
    get:
      operationId: listNeedsReviewBooks
      summary: 관리자 확인 큐 — 합본 게이트에 걸린 도서
      description: |
        ADR-014 크기 게이트(챕터 200 / 문단 15,000)에 걸려 `needs_review`가 된 책.
        챕터 수·문단 수가 없으면 화면이 임계값과 나란히 보여줄 수 없다.
        이 슬라이스에서는 읽기만 한다. 상태를 바꾸는 조작은 넣지 않는다.
      security:
        - session: []
      responses:
        "200":
          description: 확인이 필요한 도서
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NeedsReviewBookList"
        "401":
          description: 로그인이 필요하다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: 관리자 권한이 없다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/successions/orphans:
    get:
      operationId: listOrphanedSuccessions
      summary: 승계 고아 목록 — 확정 번역이 갈 곳을 잃은 기록
      description: |
        `revision_successions.orphaned > 0`인 행. 사람이 쓴 번역이 재파싱 뒤
        새 revision에 대응 문단이 없는 것이다 (ADR-004 불변식 1).
        읽기만 한다. 되살리거나 다시 붙이는 조작은 `stable_id` 규칙(ADR-016)에 닿는다.
      security:
        - session: []
      responses:
        "200":
          description: 고아가 있는 승계 기록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrphanedSuccessionList"
        "401":
          description: 로그인이 필요하다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: 관리자 권한이 없다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/users:
    get:
      operationId: listUsers
      summary: 사용자 목록
      description: |
        역할 부여 화면이 고를 수 있게 전체를 내린다. 이메일은 넣지 않는다 —
        개인정보고 화면이 쓰지 않는다.
        `admin`도 목록에는 보인다. 다만 부여 경로가 없다 (ADR-027).
      security:
        - session: []
      responses:
        "200":
          description: 사용자
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "401":
          description: 로그인이 필요하다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: 관리자 권한이 없다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/users/{userId}/role:
    post:
      operationId: setUserRole
      summary: 역할 부여 — member와 reviewer만
      description: |
        `admin`은 ADMIN_EMAIL이 유일한 출처다 (ADR-027). 이 계약으로 부여하지 않는다.
        자기 자신의 역할을 내리는 것은 거절한다 — 되돌릴 손이 사라진다.
      security:
        - session: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleInput"
      responses:
        "200":
          description: 변경됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListItem"
        "401":
          description: 로그인이 필요하다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: 관리자 권한이 없다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: 그런 사용자가 없다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: 자기 자신의 역할을 바꿀 수 없다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /projects:
    get:
      operationId: listProjects
      summary: 공개 번역 프로젝트 목록 — published만
      description: |
        도서 목록과 같은 공개 범위다 (ADR-036). `open`은 여기 없다.
        관리자가 공개할 것을 고르려면 GET /admin/projects를 쓴다.
        응답은 `{ items }`로 감싼다 (ADR-037).
      responses:
        "200":
          description: 공개된 번역 프로젝트
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"

  /projects/{projectId}/chapters:
    get:
      operationId: listProjectChapters
      summary: 번역 프로젝트의 장 목록 — 장마다 번역 진행도
      description: |
        목차 화면이 쓴다. 63장짜리 책을 이전·다음으로만 넘게 두지 않는다.

        진행도는 장 단위 **번역** 커버리지다 (ADR-023) — 색인 판정이 쓰는 것과 같은 숫자이고,
        `needs_review` 게이트가 보는 책 단위 **파싱** 수(ADR-014)와는 다른 값이다.

        책 제목·저자와 전체 진행도를 같은 응답에 담는다. 목차 머리에 필요한 것인데
        따로 부르면 화면 하나를 그리는 데 요청이 둘이 된다 —
        ARCHITECTURE "API 계약"의 "한 요청에 필요한 것을 다 조인해 내려준다"와 같은 이유다.
        `items`로 감싸는 것은 ADR-037이다. 페이지네이션 필드는 넣지 않는다.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 장 목록과 책 머리말
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectChapterList"
        "404":
          description: 프로젝트가 없거나 활성 revision이 없다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /projects/{projectId}/chapters/{idx}:
    get:
      operationId: getProjectChapter
      summary: 번역 프로젝트의 챕터 하나 — 원문과 확정 번역
      description: |
        ARCHITECTURE의 최종 계약이다. 잠정 엔드포인트 /books/{gutenbergId}/chapters/{idx}는
        번역 프로젝트가 없는 책을 위해 남겨 둔다.

        한 요청에 필요한 것을 다 조인해 내려준다. 문단마다 따로 요청하면
        N+1이 그대로 네트워크로 나간다.
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: idx
          in: path
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: 챕터와 문단
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectChapterView"
        "404":
          description: 프로젝트나 챕터가 없다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /projects/{projectId}/paragraphs/{stableId}/proposals:
    get:
      operationId: listProposals
      summary: 문단의 제안 목록
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/StableId"
      responses:
        "200":
          description: 제안 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Proposal"
    post:
      operationId: createProposal
      summary: 문단 번역 제안
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/StableId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalInput"
      responses:
        "201":
          description: 제안됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        "401":
          description: 로그인이 필요하다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: 이미 대기 중인 제안이 있다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /proposals/{proposalId}/review:
    post:
      operationId: reviewProposal
      summary: 제안 검수 — 승인 또는 거절
      description: |
        승인은 한 트랜잭션 안에서 세 가지를 함께 한다 (ARCHITECTURE 불변식 3).
        같은 문단의 동시 승인은 자문 잠금으로 직렬화된다 (ADR-024).
      security:
        - session: []
      parameters:
        - name: proposalId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "200":
          description: 처리됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResult"
        "401":
          description: 로그인이 필요하다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: 검수 권한이 없다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: 제안이 없다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: 다른 검수자가 먼저 처리했다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/projects:
    get:
      operationId: listAdminProjects
      summary: 관리자용 번역 프로젝트 목록 — open도 포함한다
      description: |
        공개할 것을 고르려면 `open`이 보여야 한다. 공개 목록(GET /projects)은
        published만 내려서 여기와 섞지 않는다.
        archived도 CHECK에 있으므로 행으로 내려준다. 다만 이 슬라이스의
        상태 전이는 open ↔ published뿐이다.
      security:
        - session: []
      responses:
        "200":
          description: 모든 번역 프로젝트
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "401":
          description: 로그인이 필요하다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: 관리자 권한이 없다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      operationId: createProject
      summary: 번역 프로젝트 생성
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          description: 로그인이 필요하다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: 관리자 권한이 없다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: 그런 책이 없다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/projects/{projectId}/status:
    post:
      operationId: setProjectStatus
      summary: 프로젝트 공개 전이 — open ↔ published
      description: |
        `published`로 올리면 도서 목록에 노출된다 (ADR-036).
        `published_at`은 처음 published가 된 시각을 기록하고, open으로 내려올 때
        비우지 않는다 — "언제 처음 공개됐는가"가 사라지면 복구할 수 없다.
        archived는 CHECK에 있지만 이 조작의 대상이 아니다.
      security:
        - session: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectStatusInput"
      responses:
        "200":
          description: 변경됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          description: 로그인이 필요하다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: 관리자 권한이 없다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: 그런 프로젝트가 없다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    StableId:
      name: stableId
      in: path
      required: true
      description: 번역이 붙는 키 (ADR-004/016)
      schema: { type: string }

  securitySchemes:
    # Google 로그인으로 발급된 세션 쿠키 (ADR-027).
    # 관리자 조작도 같은 세션을 쓰고 role='admin'으로 갈린다 —
    # 별도 토큰을 두면 우회로가 하나 생긴다.
    session:
      type: apiKey
      in: cookie
      name: reclassic_session

  schemas:
    Health:
      type: object
      required: [status, db, version]
      properties:
        status:
          type: string
          enum: [ok]
          description: 프로세스가 살아 있으면 항상 ok
        db:
          type: string
          enum: [ok, down]
          description: Postgres Ping 결과
        version:
          type: string
          description: 빌드 버전. 개발 중에는 dev

    ChapterView:
      type: object
      required: [chapter, paragraphs, totalChapters]
      properties:
        chapter:
          $ref: "#/components/schemas/Chapter"
        paragraphs:
          type: array
          items:
            $ref: "#/components/schemas/Paragraph"
        totalChapters:
          type: integer
          description: 이 revision의 전체 챕터 수. 이전·다음 링크 판단에 쓴다

    Chapter:
      type: object
      required: [idx, title]
      properties:
        idx:
          type: integer
        title:
          type: string
          description: 비어 있을 수 있다. 파서가 제목을 못 찾거나 후처리로 비운 경우다

    Paragraph:
      type: object
      required: [stableId, sourceText]
      properties:
        stableId:
          type: string
          description: 번역이 붙는 키 (ADR-004/016). paragraphs.id가 아니다
        sourceText:
          type: string

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string

    BookRequest:
      type: object
      required: [gutenbergId, title]
      properties:
        gutenbergId:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          description: 관리자가 카탈로그에서 확인한 제목. 수집 결과 검증에 쓴다
        language:
          type: string
          default: en

    BookRequestAccepted:
      type: object
      required: [bookId, status]
      properties:
        bookId:
          type: integer
          format: int64
        status:
          type: string
          enum: [pending]

    ProjectChapterList:
      type: object
      required: [book, progress, items]
      properties:
        book:
          $ref: "#/components/schemas/ProjectBook"
        progress:
          $ref: "#/components/schemas/Coverage"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChapterListItem"
      description: 배열이 아니라 객체다 (ADR-037). 머리말은 items 옆에 둔다

    ProjectBook:
      type: object
      required: [title, targetLang]
      properties:
        title:
          type: string
        author:
          type: string
          description: 원서에 저자가 없으면 생략된다
        targetLang:
          type: string

    ChapterListItem:
      type: object
      required: [idx, title, coverage]
      properties:
        idx:
          type: integer
          description: 0부터 시작하는 장 순번. 읽기 URL의 마지막 조각이다
        title:
          type: string
          description: 비어 있을 수 있다. 파서가 제목을 못 찾거나 후처리로 비운 경우다
        coverage:
          $ref: "#/components/schemas/Coverage"

    ProjectChapterView:
      type: object
      required: [chapter, paragraphs, totalChapters, coverage, indexable]
      properties:
        chapter:
          $ref: "#/components/schemas/Chapter"
        paragraphs:
          type: array
          items:
            $ref: "#/components/schemas/TranslatedParagraph"
        totalChapters:
          type: integer
        coverage:
          $ref: "#/components/schemas/Coverage"
        indexable:
          type: boolean
          description: 색인 대상인지 (ADR-023, 커버리지 80%)

    TranslatedParagraph:
      type: object
      required: [stableId, sourceText, proposalCount]
      properties:
        stableId:
          type: string
        sourceText:
          type: string
        approvedTranslation:
          type: string
          nullable: true
          description: 확정본이 없으면 null. 읽기 화면은 원문을 대신 보여준다
        proposalCount:
          type: integer
          description: 대기 중인 제안 수

    Coverage:
      type: object
      required: [total, approved, ratio]
      properties:
        total:
          type: integer
        approved:
          type: integer
        ratio:
          type: number
          format: double

    Proposal:
      type: object
      required: [id, projectId, stableId, text, authorHandle, status, createdAt]
      properties:
        id: { type: integer, format: int64 }
        projectId: { type: integer, format: int64 }
        stableId: { type: string }
        text: { type: string }
        authorHandle: { type: string }
        status:
          type: string
          enum: [pending, approved, rejected, superseded, withdrawn]
        createdAt: { type: string, format: date-time }

    ProposalInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1

    ReviewInput:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [approve, reject]
        note:
          type: string

    ReviewResult:
      type: object
      required: [proposalId, status]
      properties:
        proposalId: { type: integer, format: int64 }
        status:
          type: string
          enum: [approved, rejected]

    ProjectInput:
      type: object
      required: [gutenbergId, targetLang]
      properties:
        gutenbergId: { type: integer, minimum: 1 }
        targetLang: { type: string, minLength: 2 }

    Project:
      type: object
      required: [id, bookId, targetLang, status]
      properties:
        id: { type: integer, format: int64 }
        bookId: { type: integer, format: int64 }
        targetLang: { type: string }
        status:
          type: string
          enum: [open, published, archived]
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: 처음 published가 된 시각. open으로 내려와도 비우지 않는다 (ADR-036)

    BookList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BookListItem"
      description: 배열이 아니라 객체다. nextCursor를 나중에 붙여도 깨지지 않는다 (ADR-037)

    BookListItem:
      type: object
      required: [gutenbergId, title, projectId, targetLang]
      properties:
        gutenbergId: { type: integer }
        title: { type: string }
        author:
          type: string
          description: 원서에 저자가 없으면 빈 문자열
        projectId: { type: integer, format: int64 }
        targetLang: { type: string }

    ProjectList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectListItem"

    ProjectListItem:
      type: object
      required: [id, bookId, gutenbergId, title, targetLang, status]
      properties:
        id: { type: integer, format: int64 }
        bookId: { type: integer, format: int64 }
        gutenbergId: { type: integer }
        title: { type: string }
        author: { type: string }
        targetLang: { type: string }
        status:
          type: string
          enum: [open, published, archived]
        publishedAt:
          type: string
          format: date-time
          nullable: true

    NeedsReviewBookList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NeedsReviewBook"

    NeedsReviewBook:
      type: object
      required: [gutenbergId, title, chapterCount, paragraphCount]
      properties:
        gutenbergId: { type: integer }
        title: { type: string }
        author: { type: string }
        chapterCount:
          type: integer
          description: 최신 revision의 챕터 수. ADR-014 임계값(200)과 나란히 보여 준다
        paragraphCount:
          type: integer
          description: 최신 revision의 문단 수. ADR-014 임계값(15,000)과 나란히 보여 준다

    OrphanedSuccessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrphanedSuccession"

    OrphanedSuccession:
      type: object
      required: [gutenbergId, title, orphaned, createdAt]
      properties:
        gutenbergId: { type: integer }
        title: { type: string }
        orphaned:
          type: integer
          description: 갈 곳을 잃은 확정 번역 수
        createdAt: { type: string, format: date-time }

    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserListItem"

    UserListItem:
      type: object
      required: [id, handle, displayName, role]
      properties:
        id: { type: integer, format: int64 }
        handle: { type: string }
        displayName: { type: string }
        role:
          type: string
          enum: [member, reviewer, admin]
          description: 목록에는 admin이 보일 수 있다. 부여는 member↔reviewer만

    UserRoleInput:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [member, reviewer]
          description: admin은 ADMIN_EMAIL이 유일한 출처다 (ADR-027)

    ProjectStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [open, published]
          description: archived는 CHECK에 있지만 이 슬라이스의 전이가 아니다

    CurrentUser:
      type: object
      required: [handle, displayName, role]
      properties:
        handle:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [member, reviewer, admin]
